const polygonShapes = {

let polygonInstances = [];
let currentShapeIndex = 0; // To give each shape a unique ID
let draggingPolygon = null; // Track which polygon is being dragged
let selectedPolygon = null; // Track selected polygon

// Polygon instance structure
function createPolygonInstance(shapeName, points, x, y) {
    return {
        id: `Polygon_${currentShapeIndex++}`,
        shapeName: shapeName,
        points: points,
        x: x,
        y: y,
        angle: 0
    };
}


// Populate the shape selector dropdown
function populateShapeSelector() {
    const shapeSelect = document.getElementById('shapeSelect');
    shapeSelect.innerHTML = '<option value="">Select a shape...</option>';
    
    for (let shapeName in polygonShapes) {
        const option = document.createElement('option');
        option.value = shapeName;
        option.textContent = shapeName;
        shapeSelect.appendChild(option);
    }
}

populateShapeSelector();


// Update the layers list display
function updateLayersList() {
    const layersList = document.getElementById('layersList');
    layersList.innerHTML = '';
    
    polygonInstances.forEach((instance, index) => {
        const layerItem = document.createElement('div');
        layerItem.className = 'layer-item';
        if (selectedPolygon && selectedPolygon.id === instance.id) {
            layerItem.classList.add('selected');
        }
        
        const layerName = document.createElement('span');
        layerName.textContent = `${instance.shapeName} ${index + 1}`;
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'layer-delete-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deletePolygon(instance.id);
        };
        
        layerItem.appendChild(layerName);
        layerItem.appendChild(deleteBtn);
        
        layerItem.onclick = () => {
            selectPolygon(instance.id);
        };
        
        layersList.appendChild(layerItem);
    });
}


// Select a polygon
function selectPolygon(polygonId) {

    if (polygonId === null) {
        selectedPolygon = null;
        updateLayersList();
        highlightSelectedPolygon();
        return;
    }

    else {
        selectedPolygon = polygonInstances.find(p => p.id === polygonId);
        updateLayersList();
        highlightSelectedPolygon();

    }
}


// Highlight the selected polygon
function highlightSelectedPolygon() {
    polygonInstances.forEach(instance => {
        const polygonElement = document.getElementById(instance.id);
        if (polygonElement) {
            if (selectedPolygon && instance.id === selectedPolygon.id) {
                polygonElement.setAttribute('stroke', 'yellow');
                polygonElement.setAttribute('stroke-width', '1');
            } else {
                polygonElement.setAttribute('stroke', 'red');
                polygonElement.setAttribute('stroke-width', '1');
            }
        }
    });
}


// Delete a polygon
function deletePolygon(polygonId) {
    const polygonElement = document.getElementById(polygonId);
    if (polygonElement) {
        polygonElement.remove();
    }
    
    polygonInstances = polygonInstances.filter(p => p.id !== polygonId);
    
    if (selectedPolygon && selectedPolygon.id === polygonId) {
        selectedPolygon = null;
    }
    
    updateLayersList();
}


// Add shape button handler
document.getElementById('addShapeBtn').addEventListener('click', function() {
    const shapeSelect = document.getElementById('shapeSelect');
    const shapeName = shapeSelect.value;
    
    if (shapeName && polygonShapes[shapeName]) {
        const points = polygonShapes[shapeName];
        const newInstance = createPolygonInstance(shapeName, points, 200, 200);
        polygonInstances.push(newInstance);
        drawSVGPolygon(newInstance);
        updateLayersList();
        selectPolygon(newInstance.id);
    }
});




const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.id = 'backgroundSVG';
svg.style.position = 'fixed';
svg.style.top = '0';
svg.style.left = '0';
svg.style.width = '100%';
svg.style.height = '100%';
svg.style.pointerEvents = 'none';
svg.style.zIndex = '10';

document.body.insertBefore(svg, document.body.firstChild);
svg.addEventListener("contextmenu", (e) => e.preventDefault());

const shape_button = document.getElementById("applyShapeSettings");

var mouse_x = 0;
var mouse_y = 0;


function getCenter(points) {
    let sumX = 0, sumY = 0;
    for (let i = 0; i < points.length; i++) {
        sumX += points[i][0];
        sumY += points[i][1];
    }
    return [sumX / points.length, sumY / points.length];
}


function drawSVGPolygon(instance) {
    const points = instance.points;
    const xcord = instance.x;
    const ycord = instance.y;
    
    // Remove old polygon element if it exists
    const oldPolygon = document.getElementById(instance.id);
    if (oldPolygon) {
        oldPolygon.remove();
    }

    const polygonElement = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');

    let pointsString = '';
    const center = getCenter(points);

    var scale = 1000;
    for (let i = 0; i < points.length; i++) {
        let px = (points[i][0] - center[0]);
        let py = (points[i][1] - center[1]);

        // Apply scale
        px *= scale;
        py *= scale;

        // Apply rotation (in radians)
        const rad = instance.angle * Math.PI / 180;

        const rx = px * Math.cos(rad) - py * Math.sin(rad);
        const ry = px * Math.sin(rad) + py * Math.cos(rad);

        // Apply translation
        const x = xcord + rx;
        const y = ycord + ry;

        pointsString += `${x},${y} `;
    }
    pointsString = pointsString.trim();
    
    polygonElement.setAttribute('id', instance.id);
    polygonElement.setAttribute('points', pointsString);
    polygonElement.setAttribute('fill', 'rgba(255, 0, 0, 0.5)');
    polygonElement.setAttribute('stroke', 'red');
    polygonElement.setAttribute('stroke-width', '2');
    polygonElement.style.pointerEvents = 'auto';

    svg.appendChild(polygonElement);
    highlightSelectedPolygon();
}

// Function to redraw all polygons
function redrawAllPolygons() {
    polygonInstances.forEach(instance => {
        drawSVGPolygon(instance);
    });
}


let dragging = false;




svg.addEventListener('mousedown', (e) => {
    // Check if clicked element is a polygon
    if (e.target.tagName === 'polygon' && e.button === 0) {
        const polygonId = e.target.id;
        draggingPolygon = polygonInstances.find(p => p.id === polygonId);
        selectPolygon(polygonId);
    }

    

    if (e.target.tagName === 'polygon' && e.button === 2) {

        e.preventDefault();

        const polygonId = e.target.id;

        selectPolygon(polygonId);
        shape_popup.style.left = (e.clientX + 15) + "px";
        shape_popup.style.top = (e.clientY + 15) + "px";

        shape_popup.style.display = "block";

        document.getElementById("shapeXInput").value = selectedPolygon.x;
        document.getElementById("shapeYInput").value = selectedPolygon.y;


    }

    
    

   
    



});


window.addEventListener("mousedown", (e) => {
 
    if (e.button !== 0) return;

    const clickedPolygon = (e.target.tagName === "polygon");
    const clickedPopup   = shape_popup.contains(e.target);
    const clickedUI      =
        e.target.closest(".layers-panel") ||
        e.target.closest(".menu-bar");

    if (!clickedPopup && !clickedPolygon && shape_popup.style.display === "block") {
        shape_popup.style.display = "none";
    }

    if (!clickedPolygon && !clickedPopup && !clickedUI) {
        selectPolygon(null);
    }
});





shapeAngleSlider.addEventListener("input", () => {
    if (!selectedPolygon) return;

    selectedPolygon.angle = parseFloat(shapeAngleSlider.value);
    drawSVGPolygon(selectedPolygon);
});

shape_button.addEventListener('click', function() {

    if (!selectedPolygon) return;

    selectedPolygon.x = parseFloat(document.getElementById("shapeXInput").value);
    selectedPolygon.y = parseFloat(document.getElementById("shapeYInput").value);

    drawSVGPolygon(selectedPolygon);

});




window.addEventListener('mouseup', () => {
    draggingPolygon = null;
});


window.addEventListener('mousemove', (e) => {
    if (draggingPolygon) {
        // Update the position of the dragging polygon
        draggingPolygon.x = e.clientX;
        draggingPolygon.y = e.clientY;
        drawSVGPolygon(draggingPolygon);
    }
});






Create_button.addEventListener('click', function() {

        popup.classList.add("slide-out");

        setTimeout(() => {
            popup.classList.remove("slide-out");  
            popup.style.display = 'none';
        }, 400);

        
        canvas = document.createElement('canvas');
        canvas.width = parseInt(document.getElementById('width').value);
        canvas.height = parseInt(document.getElementById('height').value);
        document.body.appendChild(canvas);
        ctx = canvas.getContext('2d');

        canvas.style.border = '3px solid black';
        canvas.style.display = 'block';
        canvas.style.background = '#CBC3E3';
        canvas.style.margin = '20px auto';
        canvas.style.boxShadow = '0px 4px 8px rgba(0, 0, 0, 0.2)';

    });

    new_file.addEventListener('click', function() {
        
        popup.classList.add("slide-in");
        popup.style.display = 'block'; 
        
    });



    document.addEventListener('keydown', function(event) {
        
        if (event.key === 'Escape') {
            
            popup.classList.add("slide-out");
            setTimeout(() => {
            popup.classList.remove("slide-out");  
            popup.style.display = 'none';
            }, 400);
        }


        if (event.key === "Delete" && selectedPolygon) {
            deletePolygon(selectedPolygon.id);
            selectPolygon(null);
            shape_popup.style.display = "none";
        }


    });
